# GitHub Actions 配置（待启用）
#
# 放在 ci/ 而非 .github/workflows/ 的原因：
# 通过 OAuth App 登录的 gh/git 凭据若没有 `workflow` scope，GitHub 会拒收
# 对 .github/workflows/ 的推送。启用方式（两步）：
#
#   gh auth refresh -h github.com -s workflow      # 浏览器授权一次
#   mkdir -p .github/workflows && git mv ci/validate.yml .github/workflows/validate.yml
#   git commit -m "ci: 启用自动校验" && git push
#
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Shell 语法检查
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install opencc lxml python-pptx

      - name: 校验 skill 与脚本
        run: python .github/validate_skills.py

      - name: 命令行冒烟测试
        run: |
          out="$(python skills/opencc-s2hk/scripts/s2hk_convert.py --text '用户启用多租户数据隔离机制')"
          echo "输出：$out"
          test -n "$out"
          test "$out" != "用户启用多租户数据隔离机制"
